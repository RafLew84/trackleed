name: Validate current workflow

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  current-workflow:
    name: Windows Python 3.12 current workflow
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install required dependencies
        run: python -m pip install --requirement requirements-validation.txt

      - name: Run fail-closed validation
        run: python scripts/validate_current_workflow.py
